schema_version: 1
max_episode_steps: 200
watchdog_timeout_s: 120.0

navigation:
  client_module: airsim
  anchor_altitude: 2.0
  min_ground_clearance: 1.0
  workspace_xy_limit: 5.0
  workspace_up_limit: 3.0
  workspace_down_limit: 0.25
  max_horizontal_velocity: 1.0
  max_vertical_velocity: 0.5
  control_duration: 0.5
  anchor_move_velocity: 0.5
  anchor_move_timeout: 20.0
  goal_tolerance: 0.5
  min_goal_distance: 1.0
  max_episode_steps: 200
  default_goal_offset: [3.0, 0.0, 0.0]
  random_goal: false
  progress_reward_scale: 1.0
  step_penalty: -0.02
  action_penalty_scale: 0.01
  success_reward: 10.0
  collision_penalty: -10.0
  out_of_bounds_penalty: -5.0

reward:
  progress_scale: 2.0
  success_bonus: 25.0
  step_penalty: 0.02
  collision_penalty: 25.0
  safety_violation_penalty: 15.0
  unsafe_clearance_penalty_scale: 1.0
  action_magnitude_penalty_scale: 0.02
  action_change_penalty_scale: 0.04
  clearance_safety_band_m: 1.0
  emergency_clearance_m: 0.5

course:
  course_suite_path: configs/planning/m13_3_voxel_astar.yaml
  asset_catalog_path: configs/scenes/m13_2_assets.yaml
  lidar_config_path: configs/sensing/m13_4_lidar_features.yaml
  mode: fixed
  fixed_profile_id: easy
  fixed_base_seed: 1100
  seeded_profile_ids: [easy, medium, hard]
  allow_external_test_endpoints: false

authorization:
  allow_live_rpc: false
  allow_scene_mutation: false
  confirm_scene_area_clear: false
  confirm_no_visible_collision: false
  allow_debug_markers: false
  allow_marker_flush: false
  allow_flight: false
  allow_start_positioning: false
  confirm_clear_airspace: false
